const scenarios=[['Everyday','A friend asks what you did at the weekend.','What did you get up to this weekend?','¿Qué hiciste este fin de semana?'],['Work','You meet an international colleague for the first time.','So, what do you do at your company?','¿A qué te dedicas en tu empresa?'],['Networking','You are having dinner after a business event.','How are you finding the event so far?','¿Qué te está pareciendo el evento hasta ahora?'],['Everyday','You are organising a family weekend.','Any plans for the weekend?','¿Tienes planes para el fin de semana?'],['Work','A colleague heard about your new role.','What are you most excited about in your new role?','¿Qué es lo que más ilusión te hace de tu nuevo puesto?'],['Travel','You are talking to someone at the airport.','What brings you to New York?','¿Qué te trae a Nueva York?'],['Everyday','A friend asks about your children.','How are the kids doing?','¿Qué tal están los niños?'],['Work','A partner wants to understand your team.','What are you trying to achieve this year?','¿Qué intentáis conseguir este año?'],['Conversation','Someone uses a phrase you do not understand.','What are you looking forward to?','¿Qué te hace ilusión próximamente?'],['Work','A project has run into difficulties.','How are you planning to deal with it?','¿Cómo piensas afrontarlo?']];

const KEY='aeg_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){};state=state&&state.version===1?state:{version:1,started:null,history:[],progress:{},observations:[],settings:{goal:30,newWords:5},session:null};let page='home',game=null,exercise=null,selected=null,answer='',revealed=false,stage=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('No se ha podido guardar. Exporta una copia de seguridad.')}}function today(){return new Date().toLocaleDateString('en-CA')}function day(){if(!state.started)return 0;return Math.min(15,Math.max(1,Math.floor((new Date(today())-new Date(state.started))/86400000)+1))}function done(type){return state.history.some(x=>x.date===today()&&x.type===type)}function record(type,detail={}){if(!state.started)state.started=today();state.history.push({type,date:today(),at:Date.now(),...detail});save()}function p(id){return state.progress[id]||{level:0,attempts:0,correct:0,due:0}}function updateV(id,success,level){let v=p(id);v.attempts++;if(success)v.correct++;v.level=Math.max(v.level,success?level:0);if(!success)v.level=Math.min(v.level,1);const delays=[0,1,2,4,7,14];v.due=Date.now()+(success?delays[Math.min(v.level,5)]:0)*86400000;state.progress[id]=v;save()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(x){page=x;game=null;exercise=null;selected=null;answer='';revealed=false;render()}function header(){return `<header class="top"><div class="logo">ACTIVE <span>ENGLISH</span> GYM</div><span class="pill">${day()?`DAY ${day()} / 15`:'READY TO START'}</span></header>`}function nav(){return `<nav class="nav">${[['home','⌂','Home'],['speak','◉','Speak'],['fluency','ϟ','Gym'],['words','▦','Words'],['progress','↗','Progress']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}function shell(s){document.getElementById('app').innerHTML=`<main class="app">${header()}${s}</main>${nav()}`}
function home(){let modules=[['speak','◉','Speak Club','Conversaciones y situaciones reales','12 min'],['fluency','ϟ','Fluency Gym','Comprender, responder y reformular','7 min'],['words','▦','Word Rush','Vocabulario que sale sin pensar','8 min'],['fix','✓','Daily Fix','Recupera lo que más te cuesta','3 min']];let completed=modules.filter(x=>done(x[0])).length;shell(`<div class="eyebrow">YOUR PERSONAL ENGLISH TRAINER</div><h1>Less studying.<br>More speaking<span style="color:#6c8251">.</span></h1><p class="sub">Entrena el inglés que ya sabes. Haz que salga de forma natural.</p><div class="card dark"><div class="row"><div><div class="eyebrow" style="color:#b4c59a">TODAY'S WORKOUT</div><h2 style="margin:10px 0">Ready to train?</h2></div><span style="font-size:40px">↗</span></div><p class="sub">${completed} de 4 módulos completados hoy</p><div class="meter"><div style="width:${completed*25}%"></div></div><button class="btn alt" onclick="go('${modules.find(x=>!done(x[0]))?.[0]==='fix'?'fix':modules.find(x=>!done(x[0]))?.[0]||'words'}')">${completed===4?'Keep training ↗':'Start today’s workout →'}</button></div><div class="section"><div class="row"><h3>Training zones</h3><span class="mini">30 min / día</span></div><div class="card" style="padding:5px 19px">${modules.map(x=>`<div class="module" onclick="go('${x[0]}')"><div class="symbol">${x[1]}</div><div class="grow"><b>${x[2]}</b><small>${x[3]}</small></div><div style="text-align:right"><b style="font-size:12px">${done(x[0])?'✓':x[4]}</b><small>→</small></div></div>`).join('')}</div></div><div class="notice">Tu progreso se guarda en este navegador. Exporta una copia desde Progress para no perderlo.</div>`)}
function wordPool(){const ids=vocab.filter(v=>p(v.id).attempts&&p(v.id).due<=Date.now()).map(v=>v.id);const fresh=vocab.filter(v=>!p(v.id).attempts).slice(0,Math.max(1,+state.settings.newWords||5)).map(v=>v.id);return [...new Set([...ids,...fresh])]}function startWords(){let pool=wordPool();if(!pool.length)pool=vocab.filter(v=>p(v.id).level<4).map(v=>v.id);game={type:'words',ids:pool.slice(0,Math.min(10,pool.length)),index:0,score:0,mode:0};selected=null;revealed=false;render()}function words(){if(game?.type==='words')return wordGame();let reviewed=Object.values(state.progress).filter(x=>x.attempts).length;let due=wordPool().length;shell(`<div class="eyebrow">VOCABULARY WORKOUT</div><h1>Word Rush<span style="color:#829c4b">.</span></h1><p class="sub">Menos memorizar. Más recuperar expresiones sin ayuda.</p><div class="stats"><div class="stat"><strong>${reviewed}</strong><small>Expresiones practicadas</small></div><div class="stat"><strong>${due}</strong><small>En la ronda de hoy</small></div></div><div class="card dark"><div class="eyebrow" style="color:#b5c3a4">QUICK WORKOUT</div><h2>Ready for your reps?</h2><p class="sub">Alterna recuperación libre y reconocimiento. Las respuestas con ayuda no cuentan como dominio espontáneo.</p><button class="btn alt" onclick="startWords()">Start Word Rush →</button></div><h3 class="section">Tu vocabulario</h3><div class="card" style="max-height:280px;overflow:auto">${vocab.slice(0,30).map(v=>`<div class="module"><div class="grow"><b>${esc(v.en)}</b><small>${esc(v.es)}</small></div><span class="pill">${p(v.id).level>=3?'RECALL':p(v.id).attempts?'PRACTICE':'NEW'}</span></div>`).join('')}</div>`)}
function wordGame(){if(game.index>=game.ids.length){record('words',{score:game.score,total:game.ids.length});game=null;return shell(`<div class="eyebrow">WORKOUT COMPLETE</div><h1>Nice reps<span style="color:#829c4b">.</span></h1><div class="card dark"><h2>${game===null?'Ronda terminada':''}</h2><p class="sub">Has entrenado la recuperación de expresiones. Volverán a aparecer según tus resultados.</p></div><button class="btn alt" onclick="startWords()">Otra ronda →</button><button class="btn outline" onclick="go('home')">Volver a Home</button>`)}let id=game.ids[game.index],v=vocab[id],mode=game.index%3;let opts=[v.en,...vocab.filter(x=>x.id!==id&&x.cat===v.cat).slice(0,2).map(x=>x.en)].sort((a,b)=>((a.charCodeAt(0)+id*13)%17)-((b.charCodeAt(0)+id*13)%17));shell(`<div class="row"><div class="eyebrow">WORD RUSH · ${mode===1?'NATURAL OR NOT':'FLASH RECALL'}</div><span class="pill">${game.index+1} / ${game.ids.length}</span></div><div class="bar"><div style="width:${game.index/game.ids.length*100}%"></div></div><div class="card"><div class="eyebrow">HOW WOULD YOU SAY IT?</div><div class="prompt">${esc(v.es)}</div>${mode===1?opts.map(o=>`<button class="choice ${selected===o?'selected':''}" onclick="selected=${JSON.stringify(o).replace(/"/g,'&quot;')};render()">${esc(o)}</button>`).join(''):`<input class="input" id="wordinput" placeholder="Escríbelo en inglés (sin mirar)…" value="${esc(answer)}" oninput="answer=this.value" autocapitalize="off" autocomplete="off" spellcheck="false">`} ${!revealed?`<button class="btn" onclick="${mode===1?'revealWord()':'revealWord()'}">Comprobar / mostrar respuesta</button>`:`<div class="feedback"><b>${esc(v.en)}</b><br>${esc(v.ex)}${mode===1?`<br><small>${selected===v.en?'✓ Opción correcta':'La opción correcta era esta.'}</small>`:''}</div><div class="mini" style="margin-top:12px">¿La recuperaste sin ayuda? Sé exigente: reconocerla no equivale a producirla.</div><div class="flex"><button class="btn outline sm" onclick="nextWord(false)">Necesité ayuda</button><button class="btn alt sm" onclick="nextWord(true)">${mode===1?'La reconocí':'La recordé sola'}</button></div>`}</div><button class="link" onclick="go('words')">Salir de la ronda</button>`)}function revealWord(){revealed=true;render()}function nextWord(ok){let mode=game.index%3,id=game.ids[game.index];if(mode===1){ok=ok&&selected===vocab[id].en;updateV(id,ok,1)}else{updateV(id,ok,3)}if(ok)game.score++;game.index++;answer='';selected=null;revealed=false;render()}
function fluency(){if(exercise?.type==='fluency')return fluencyGame();shell(`<div class="eyebrow">YOUR FLUENCY WORKOUT</div><h1>Fluency Gym<span style="color:#829c4b">.</span></h1><p class="sub">Cuatro ejercicios cortos para responder más rápido, sin quedarte en blanco.</p><div class="card dark"><h2>7-minute circuit</h2>${[['01','Quick Decode','Entiende preguntas naturales'],['02','Instant Answer','Responde sin preparar'],['03','Word Rescue','Explica sin la palabra exacta'],['04','Transfer Test','Llévalo a otra situación']].map(x=>`<div class="module" style="border-color:#44483f"><span class="pill">${x[0]}</span><div><b>${x[1]}</b><small style="color:#c5c9c0">${x[2]}</small></div></div>`).join('')}<button class="btn alt" onclick="startFluency()">Start circuit →</button></div>`)}function startFluency(){exercise={type:'fluency',step:0,idx:Math.floor(Math.random()*decode.length),responses:[]};selected=null;answer='';revealed=false;render()}function fluencyGame(){let s=exercise.step,d=decode[exercise.idx],prompts=[['A colleague has heard about your new responsibilities.','What is changing in your role?'],['A friend asks you about your weekend.','What did you get up to this weekend?'],['You meet someone at an international event.','What brought you here?']];let prompt=prompts[exercise.idx%prompts.length];if(s>=4){record('fluency',{responses:exercise.responses});exercise=null;return shell(`<div class="eyebrow">CIRCUIT COMPLETE</div><h1>Workout done<span style="color:#829c4b">.</span></h1><p class="sub">Has entrenado comprensión, respuesta, reformulación y transferencia. La práctica oral real sigue siendo esencial.</p><button class="btn alt" onclick="go('home')">Back to Home →</button>`)}shell(`<div class="row"><div class="eyebrow">FLUENCY GYM</div><span class="pill">${s+1} / 4</span></div><div class="bar"><div style="width:${s*25}%"></div></div><div class="card"><div class="eyebrow">${['01 · QUICK DECODE','02 · INSTANT ANSWER','03 · WORD RESCUE','04 · TRANSFER TEST'][s]}</div>${s===0?`<div class="prompt">${esc(d[0])}</div>${d[2].map(o=>`<button class="choice ${selected===o?'selected':''}" onclick="selected=${JSON.stringify(o).replace(/"/g,'&quot;')};render()">${esc(o)}</button>`).join('')}`:s===1?`<p class="sub">${esc(prompt[0])}</p><div class="prompt">${esc(prompt[1])}</div><textarea class="input" placeholder="Responde en inglés con 2–3 frases…" oninput="answer=this.value">${esc(answer)}</textarea>`:s===2?`<p class="sub">Explica cómo conseguir que equipos de distintos países trabajen juntos.</p><div class="prompt">Sin usar: alignment, coordination, collaboration.</div><textarea class="input" placeholder="Explain it in your own words…" oninput="answer=this.value">${esc(answer)}</textarea>`:`<p class="sub">Un amigo quiere hacer demasiados planes en un solo día.</p><div class="prompt">What would you suggest?</div><textarea class="input" placeholder="Respond naturally in English…" oninput="answer=this.value">${esc(answer)}</textarea>`}${revealed?`<div class="feedback">${s===0?`Respuesta: <b>${esc(d[1])}</b>`:s===1?'Ejemplo: “My role is changing quite a lot. I’ll lead a new team, with more responsibilities and some exciting challenges ahead.”':s===2?'Ejemplo: “My job is to help teams in different countries work together, share goals and move in the same direction.”':'Ejemplo: “I’d try to find a way to do a bit of everything. We could spend less time on each activity and fit more things in.”'}<p class="mini">En respuestas abiertas, el ejemplo no significa que tu respuesta sea incorrecta.</p></div><button class="btn alt" onclick="nextFluency()">Next exercise →</button>`:`<button class="btn" onclick="checkFluency()">${s===0?'Check answer':'See an example & continue'}</button>`}</div>`)}function checkFluency(){if(exercise.step===0&&!selected)return alert('Elige una opción');if(exercise.step>0&&!answer.trim())return alert('Intenta responder primero');revealed=true;render()}function nextFluency(){exercise.responses.push({step:exercise.step,response:exercise.step===0?selected:answer});exercise.step++;selected=null;answer='';revealed=false;render()}
function speak(){if(exercise?.type==='speak')return speakGame();shell(`<div class="eyebrow">CONVERSATION TRAINING</div><h1>Speak Club<span style="color:#829c4b">.</span></h1><p class="sub">Situaciones reales. Intenta responder en voz alta antes de escribir o revelar la traducción.</p><div class="card dark"><h2>Let's talk.</h2><p class="sub">Una pregunta cada vez. Sin presión por responder perfecto.</p><button class="btn alt" onclick="startSpeak()">Start conversation →</button></div><div class="notice">V1: simulador de conversación con preguntas preparadas. No es una llamada de voz con IA. Puedes escuchar las preguntas si tu navegador lo permite.</div>`)}function startSpeak(){exercise={type:'speak',idx:Math.floor(Math.random()*scenarios.length),count:0,answers:[]};answer='';revealed=false;render()}function speakGame(){let sc=scenarios[exercise.idx%scenarios.length];shell(`<div class="row"><div class="eyebrow">SPEAK CLUB · ${esc(sc[0])}</div><span class="pill">${exercise.count+1} / 5</span></div><div class="card"><p class="sub">${esc(sc[1])}</p><div class="prompt">${esc(sc[2])}</div><div class="flex"><button class="btn outline sm" onclick="say(${JSON.stringify(sc[2]).replace(/"/g,'&quot;')})">▶ Listen</button><button class="btn outline sm" onclick="revealed=!revealed;render()">${revealed?'Hide':'Show'} meaning</button></div>${revealed?`<div class="feedback">${esc(sc[3])}</div>`:''}<p class="mini" style="margin-top:18px">Primero responde en voz alta. Después apunta una frase o qué te ha bloqueado.</p><textarea class="input" placeholder="My answer / What blocked me…" oninput="answer=this.value">${esc(answer)}</textarea><button class="btn alt" onclick="nextSpeak()">Save & next →</button></div>`)}function say(t){if(!('speechSynthesis'in window))return alert('Este navegador no admite lectura de voz');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}function nextSpeak(){exercise.answers.push({question:scenarios[exercise.idx%scenarios.length][2],response:answer});exercise.count++;if(exercise.count>=5){record('speak',{answers:exercise.answers});exercise=null;return shell(`<h1>Great session<span style="color:#829c4b">.</span></h1><p class="sub">Has completado cinco situaciones de conversación. ¿Qué expresiones se te resistieron? Repásalas en Word Rush.</p><button class="btn alt" onclick="go('home')">Back to Home</button>`)}exercise.idx=(exercise.idx+1)%scenarios.length;answer='';revealed=false;render()}
function fix(){let list=vocab.filter(v=>p(v.id).attempts&&p(v.id).level<3).slice(0,3);if(!list.length)list=vocab.slice(0,3);shell(`<div class="eyebrow">POST-WORKOUT RECOVERY</div><h1>Daily Fix<span style="color:#829c4b">.</span></h1><p class="sub">Recupera estas tres expresiones sin mirar el inglés. Léelas en voz alta.</p>${list.map(v=>`<div class="card"><div class="eyebrow">RECALL</div><div class="prompt">${esc(v.es)}</div><details><summary class="mini" style="cursor:pointer">Mostrar expresión</summary><div class="feedback"><b>${esc(v.en)}</b><br>${esc(v.ex)}</div></details><div class="flex"><button class="btn outline sm" onclick="updateV(${v.id},false,0);this.textContent='Registrado ✓'">Necesité ayuda</button><button class="btn alt sm" onclick="updateV(${v.id},true,3);this.textContent='Registrado ✓'">La recordé sola</button></div></div>`).join('')}<button class="btn" onclick="record('fix');go('home')">Finish Daily Fix →</button>`)}
function progress(){let all=Object.values(state.progress),practiced=all.filter(v=>v.attempts).length,recalled=all.filter(v=>v.level>=3).length,sessions=state.history.filter(x=>['words','fluency','speak','fix'].includes(x.type)).length;shell(`<div class="eyebrow">YOUR TRAINING JOURNEY</div><h1>My Progress<span style="color:#829c4b">.</span></h1><div class="stats"><div class="stat"><strong>${sessions}</strong><small>Módulos completados</small></div><div class="stat"><strong>${practiced}</strong><small>Expresiones practicadas</small></div><div class="stat"><strong>${recalled}</strong><small>Recuperadas sin ayuda*</small></div><div class="stat"><strong>${state.history.filter(x=>x.type==='speak').length}</strong><small>Sesiones Speak Club</small></div></div><p class="mini">*Autodeclarado; no equivale a uso espontáneo en una conversación.</p><div class="card"><h3>15-day experiment</h3><p class="sub">${state.started?'Comenzaste el '+esc(state.started):'Empieza un entrenamiento para activar el día 1.'}</p><div class="meter"><div style="width:${day()/15*100}%"></div></div><p class="mini">Día 0 · Diagnóstico inicial | Día 8 · Comparación | Día 15 · Evaluación</p></div><div class="card"><h3>Session journal</h3><textarea id="note" class="input" placeholder="¿Qué ha salido más fácil hoy? ¿Dónde te has bloqueado?"></textarea><button class="btn sm" onclick="saveNote()">Save observation</button>${state.observations.slice(-4).reverse().map(o=>`<div class="module"><div><small>${esc(o.date)}</small><div class="sub">${esc(o.text)}</div></div></div>`).join('')}</div><div class="card"><h3>Data & settings</h3><p class="sub">Todo se guarda localmente en este navegador. Exporta una copia para no perderlo.</p><div class="flex"><button class="btn outline sm" onclick="exportData()">↓ Export JSON</button><button class="btn outline sm" onclick="document.getElementById('import').click()">↑ Import JSON</button></div><input id="import" type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"><label class="mini" style="display:block;margin-top:17px">Nuevas expresiones por día: <select id="newwords" onchange="state.settings.newWords=Number(this.value);save()">${[3,5,8,10].map(n=>`<option ${state.settings.newWords===n?'selected':''}>${n}</option>`).join('')}</select></label><button class="link" style="margin-top:22px" onclick="clearData()">Borrar datos locales</button></div>`)}function saveNote(){let el=document.getElementById('note');if(!el.value.trim())return;state.observations.push({date:today(),text:el.value.trim()});save();render()}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='active-english-gym-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.version!==1||!d.progress||!Array.isArray(d.history))throw Error();if(confirm('¿Sustituir el progreso actual por esta copia?')){state=d;save();render()}}catch(e){alert('El archivo no es una copia válida.')}};r.readAsText(f)}function clearData(){if(confirm('¿Borrar todo el progreso guardado en este navegador? Esta acción no se puede deshacer.')){localStorage.removeItem(KEY);location.reload()}}
function render(){if(page==='home')home();else if(page==='words')words();else if(page==='fluency')fluency();else if(page==='speak')speak();else if(page==='fix')fix();else progress()}render();
</script></body></html>
